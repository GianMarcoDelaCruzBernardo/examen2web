databases:
  - name: bd-farmacia
    databaseName: bd_farmacia
    plan: free

services:
  - type: web
    name: farmacia-app
    runtime: node
    plan: free
    buildCommand: npm install --omit=optional
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bd-farmacia
          property: connectionString
